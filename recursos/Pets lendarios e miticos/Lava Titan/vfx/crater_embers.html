<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Lava Titan — crater_embers</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<!-- Lava Titan v3, efeito "crater_embers" para flipbook (.framework/flipbook.py). Contrato de Recursos/VFX/halo-solar.html:
     canvas #fx quadrado, fundo transparente, window.renderFrame(t) determinístico, margem ~8%. -->
<canvas id="fx" width="512" height="512"></canvas>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647;}
function blob(x,y,r,stops){const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,c])=>g.addColorStop(o,c));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
// brasas e chama baixa saindo da cratera (Loop): 1 lingua de fogo laranja + 7 brasas subindo
window.renderFrame=function(t){const s=canvas.width,c=s/2;ctx.clearRect(0,0,s,s);ctx.globalCompositeOperation='lighter';
 const f=0.85+0.15*Math.sin(t*Math.PI*4);
 ctx.save();ctx.translate(c,s*0.86);ctx.scale(1,1.7*f);blob(0,-s*0.10,s*0.20,[[0,'rgba(255,200,120,0.9)'],[0.4,'rgba(255,122,26,0.7)'],[1,'rgba(255,74,16,0)']]);ctx.restore();
 for(let k=0;k<7;k++){const r=rng(53+k);r();const p=(t+k/7)%1,x=c+(r()-0.5)*s*0.35+Math.sin((p*2+k)*Math.PI)*s*0.05,y=s*(0.84-0.72*p),a=Math.sin(Math.PI*p);
  blob(x,y,s*(0.035+0.02*r()),[[0,`rgba(255,235,180,${a})`],[0.4,`rgba(255,122,26,${0.8*a})`],[1,'rgba(255,74,16,0)']]);}
};
if(!navigator.webdriver){document.body.style.background='#1b1f33';let t0=performance.now();(function f(n){window.renderFrame(((n-t0)/1600)%1);requestAnimationFrame(f);})(t0);}
</script></body></html>
