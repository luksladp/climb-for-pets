<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Lava Titan — slam_ring</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<!-- Lava Titan v3, efeito "slam_ring" para flipbook (.framework/flipbook.py). Contrato de Recursos/VFX/halo-solar.html:
     canvas #fx quadrado, fundo transparente, window.renderFrame(t) determinístico, margem ~8%. -->
<canvas id="fx" width="512" height="512"></canvas>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647;}
function blob(x,y,r,stops){const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,c])=>g.addColorStop(o,c));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
window.renderFrame=function(t){const s=canvas.width,c=s/2;ctx.clearRect(0,0,s,s);
 const e=1-Math.pow(1-t,3),R=s*(0.08+0.34*e);
 for(let k=0;k<14;k++){const a=k/14*Math.PI*2+0.2,r=rng(31+k);r();const d=R*(0.85+0.25*r());
  blob(c+Math.cos(a)*d,c+Math.sin(a)*d,s*(0.05+0.07*t),[[0,`rgba(150,132,124,${0.6*(1-t)})`],[1,'rgba(110,96,90,0)']]);}
 ctx.globalCompositeOperation='lighter';
 ctx.lineWidth=s*(0.06*(1-t)+0.01);ctx.strokeStyle=`rgba(255,120,30,${1-t})`;ctx.beginPath();ctx.arc(c,c,R,0,Math.PI*2);ctx.stroke();
 ctx.lineWidth=s*0.018*(1-t);ctx.strokeStyle=`rgba(255,230,140,${1-t})`;ctx.beginPath();ctx.arc(c,c,R*0.97,0,Math.PI*2);ctx.stroke();
 blob(c,c,R*0.8,[[0,`rgba(255,160,50,${0.5*(1-t)*(1-t)})`],[1,'rgba(255,74,16,0)']]);
};
if(!navigator.webdriver){document.body.style.background='#1b1f33';let t0=performance.now();(function f(n){window.renderFrame(((n-t0)/1600)%1);requestAnimationFrame(f);})(t0);}
</script></body></html>
