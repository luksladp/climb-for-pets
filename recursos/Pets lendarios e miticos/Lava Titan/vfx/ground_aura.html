<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Lava Titan — ground_aura</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<!-- Lava Titan v3, efeito "ground_aura" para flipbook (.framework/flipbook.py). Contrato de Recursos/VFX/halo-solar.html:
     canvas #fx quadrado, fundo transparente, window.renderFrame(t) determinístico, margem ~8%. -->
<canvas id="fx" width="512" height="512"></canvas>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647;}
function blob(x,y,r,stops){const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,c])=>g.addColorStop(o,c));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
// aura de brasas no chão (Loop, visto de cima): anel laranja suave que respira + 12 brasas girando devagar
window.renderFrame=function(t){const s=canvas.width,c=s/2,R=s*0.36;ctx.clearRect(0,0,s,s);ctx.globalCompositeOperation='lighter';
 const p=0.75+0.25*Math.sin(t*Math.PI*2);
 const g=ctx.createRadialGradient(c,c,R*0.6,c,c,R*1.15);g.addColorStop(0,'rgba(255,74,16,0)');g.addColorStop(0.55,`rgba(255,90,20,${0.6*p})`);g.addColorStop(1,'rgba(255,74,16,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(c,c,R*1.15,0,Math.PI*2);ctx.fill();
 for(let k=0;k<12;k++){const a=k/12*Math.PI*2+t*Math.PI*2/12,r=rng(71+k);r();const d=R*(0.88+0.18*r()),fl=0.6+0.4*Math.sin((t*2+k/3)*Math.PI*2);
  blob(c+Math.cos(a)*d,c+Math.sin(a)*d,s*0.035,[[0,`rgba(255,150,60,${fl})`],[0.5,`rgba(255,90,20,${0.7*fl})`],[1,'rgba(255,74,16,0)']]);}
};
if(!navigator.webdriver){document.body.style.background='#1b1f33';let t0=performance.now();(function f(n){window.renderFrame(((n-t0)/1600)%1);requestAnimationFrame(f);})(t0);}
</script></body></html>
