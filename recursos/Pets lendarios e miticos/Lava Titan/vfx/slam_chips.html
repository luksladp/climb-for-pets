<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Lava Titan — slam_chips</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<!-- Lava Titan v3, efeito "slam_chips" para flipbook (.framework/flipbook.py). Contrato de Recursos/VFX/halo-solar.html:
     canvas #fx quadrado, fundo transparente, window.renderFrame(t) determinístico, margem ~8%. -->
<canvas id="fx" width="512" height="512"></canvas>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647;}
function blob(x,y,r,stops){const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,c])=>g.addColorStop(o,c));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
window.renderFrame=function(t){const s=canvas.width,c=s/2;ctx.clearRect(0,0,s,s);
 const r=rng(101+Math.round(t*12)),n=5+Math.floor(r()*3),pts=[];
 for(let i=0;i<n;i++){const a=i/n*Math.PI*2+r()*0.5,d=s*(0.22+0.16*r());pts.push([c+Math.cos(a)*d,c+Math.sin(a)*d*0.8]);}
 ctx.beginPath();pts.forEach(p=>ctx.lineTo(...p));ctx.closePath();
 ctx.fillStyle='#5E5450';ctx.fill();ctx.lineWidth=s*0.035;ctx.strokeStyle='#FF6A18';ctx.stroke();
 ctx.beginPath();ctx.moveTo(...pts[0]);ctx.lineTo(...pts[1]);ctx.lineTo(c,c);ctx.closePath();ctx.fillStyle='#8E8682';ctx.fill();
};
if(!navigator.webdriver){document.body.style.background='#1b1f33';let t0=performance.now();(function f(n){window.renderFrame(((n-t0)/1600)%1);requestAnimationFrame(f);})(t0);}
</script></body></html>
