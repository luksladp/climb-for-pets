<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Molten Dragon — pulso de magma da fornalha no peito (Loop)</title>
<style>html, body { margin: 0; background: transparent; } body.preview { background: #1b1f33; display: grid; place-items: center; height: 100vh; } canvas { display: block; }</style>
</head>
<body>
<!-- Efeito do Molten Dragon (Mythic, Volcano) para flipbook do Roblox: pulso de magma da fornalha no peito (Loop)
     Contrato de Recursos/VFX/halo-solar.html: <canvas id="fx">, window.renderFrame(t) determinístico, margem de 8%.
     Gerar: python .framework/flipbook.py "Recursos/Pets lendarios e miticos/Molten Dragon/vfx/pulso-fornalha.html" --grade 4 --loop -->
<canvas id="fx" width="512" height="512"></canvas>
<script>
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function glow(x, y, r, stops) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const TAU = Math.PI * 2;
window.renderFrame = function (t) {
  const s = canvas.width, c = s / 2;
  ctx.clearRect(0, 0, s, s);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';

  // núcleo que pulsa + anel que se expande e some
  const p = 0.7 + 0.3 * Math.sin(t * TAU);
  glow(c, c, s * 0.3 * p, [[0, `rgba(255,245,190,${0.95 * p})`], [0.35, `rgba(255,150,40,${0.7 * p})`], [1, 'rgba(255,70,10,0)']]);
  const rr = s * (0.12 + 0.3 * t), a = 0.8 * Math.sin(Math.PI * t) * (1 - t) * 1.6;
  ctx.strokeStyle = `rgba(255,140,40,${a})`; ctx.lineWidth = s * 0.03 * (1 - t) + 2;
  ctx.beginPath(); ctx.arc(c, c, rr, 0, TAU); ctx.stroke();
  ctx.restore();
};
if (!navigator.webdriver) {
  document.body.classList.add('preview');
  const t0 = performance.now();
  (function loop(now) { window.renderFrame(((now - t0) / 1000 / 1.6) % 1); requestAnimationFrame(loop); })(t0);
}
</script>
</body>
</html>
