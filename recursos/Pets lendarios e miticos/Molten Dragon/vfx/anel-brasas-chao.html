<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Molten Dragon — anel de brasas girando no chão (Loop, efeito de chão do Mythic)</title>
<style>html, body { margin: 0; background: transparent; } body.preview { background: #1b1f33; display: grid; place-items: center; height: 100vh; } canvas { display: block; }</style>
</head>
<body>
<!-- Efeito do Molten Dragon (Mythic, Volcano) para flipbook do Roblox: anel de brasas girando no chão (Loop, efeito de chão do Mythic)
     Contrato de Recursos/VFX/halo-solar.html: <canvas id="fx">, window.renderFrame(t) determinístico, margem de 8%.
     Gerar: python .framework/flipbook.py "Recursos/Pets lendarios e miticos/Molten Dragon/vfx/anel-brasas-chao.html" --grade 4 --loop -->
<canvas id="fx" width="512" height="512"></canvas>
<script>
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function glow(x, y, r, stops) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const TAU = Math.PI * 2;
window.renderFrame = function (t) {
  const s = canvas.width, c = s / 2;
  ctx.clearRect(0, 0, s, s);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';

  // anel visto de cima: faixa de magma com brasas que giram 1/8 de volta por ciclo
  const R = s * 0.36;
  ctx.strokeStyle = 'rgba(255,110,30,0.45)'; ctx.lineWidth = s * 0.05;
  ctx.beginPath(); ctx.arc(c, c, R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,200,90,0.5)'; ctx.lineWidth = s * 0.012;
  ctx.beginPath(); ctx.arc(c, c, R, 0, TAU); ctx.stroke();
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU + t * TAU / 8, f = 0.6 + 0.4 * Math.sin((t * 2 + i / 4) * TAU);
    glow(c + Math.cos(a) * R, c + Math.sin(a) * R, s * 0.05 * (0.8 + f * 0.6),
         [[0, `rgba(255,235,150,${0.9 * f})`], [1, 'rgba(255,100,20,0)']]);
  }
  ctx.restore();
};
if (!navigator.webdriver) {
  document.body.classList.add('preview');
  const t0 = performance.now();
  (function loop(now) { window.renderFrame(((now - t0) / 1000 / 3.0) % 1); requestAnimationFrame(loop); })(t0);
}
</script>
</body>
</html>
