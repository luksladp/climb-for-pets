<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>flame — Volcanic Phoenix (flipbook)</title>
<style>html,body{margin:0;background:transparent}body.preview{background:#1b1f33;display:grid;place-items:center;height:100vh}canvas{display:block}</style>
</head><body>
<!-- Chama de verdade nas pontas das asas, na crista e na cauda (Loop, grade 4x4): língua de fogo que tremula e sobe, laranja-lava com miolo claro.
Contrato de Recursos/VFX/halo-solar.html: canvas #fx, window.renderFrame(t) determinístico, fundo transparente, margem ~8%. -->
<canvas id="fx" width="512" height="512"></canvas>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647;}
function glow(x,y,r,stops){const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([p,c])=>g.addColorStop(p,c));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
window.renderFrame=function(t){const s=canvas.width,c=s/2;ctx.clearRect(0,0,s,s);ctx.save();ctx.translate(c,s*0.84);ctx.globalCompositeOperation='lighter';
const T=t*Math.PI*2;
function tongue(w,h,sway,col0,col1,a){ctx.beginPath();ctx.moveTo(-w,0);
for(let i=0;i<=20;i++){const v=i/20,y=-h*v,x=-w*(1-v)*(1-v*0.3)+Math.sin(T+v*5)*sway*v;ctx.lineTo(x,y);} 
for(let i=20;i>=0;i--){const v=i/20,y=-h*v,x=w*(1-v)*(1-v*0.3)+Math.sin(T+v*5+0.6)*sway*v;ctx.lineTo(x,y);} ctx.closePath();
const g=ctx.createLinearGradient(0,0,0,-h);g.addColorStop(0,col0);g.addColorStop(1,col1);ctx.fillStyle=g;ctx.globalAlpha=a;ctx.fill();ctx.globalAlpha=1;}
glow(0,-s*0.08,s*0.22,[[0,'rgba(255,120,40,0.45)'],[1,'rgba(255,60,20,0)']]);
for(let k=0;k<3;k++){const ph=T+k*2.1;const h=s*(0.5+0.12*Math.sin(ph))*(1-k*0.2),w=s*(0.15-k*0.02);ctx.save();ctx.translate((k-1)*s*0.07,0);
tongue(w,h,s*0.06,'rgba(255,90,30,0.9)','rgba(255,40,10,0)',0.85);ctx.restore();}
tongue(s*0.08,s*0.32*(1+0.1*Math.sin(T*2)),s*0.03,'rgba(255,225,150,0.95)','rgba(255,150,50,0)',0.9);
const r=rng(9);for(let i=0;i<6;i++){const x0=(r()-0.5)*s*0.3,ph=(t+r())%1,y=-s*0.15-ph*s*0.55,a=Math.sin(ph*Math.PI);glow(x0+Math.sin(T+i)*s*0.03,y,s*0.012,[[0,`rgba(255,220,150,${a})`],[1,'rgba(255,100,30,0)']]);}
ctx.restore();};
if(!navigator.webdriver){document.body.classList.add('preview');let t0=performance.now();(function loop(n){window.renderFrame(((n-t0)/900)%1);requestAnimationFrame(loop);})(t0);}
</script></body></html>
