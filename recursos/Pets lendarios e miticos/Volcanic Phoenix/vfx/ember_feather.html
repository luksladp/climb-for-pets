<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ember_feather — Volcanic Phoenix (flipbook)</title>
<style>html,body{margin:0;background:transparent}body.preview{background:#1b1f33;display:grid;place-items:center;height:100vh}canvas{display:block}</style>
</head><body>
<!-- Efeito exclusivo ember_fall: pena incandescente que cai girando e apaga para cinza (OneShot, vida 3 s).
Contrato de Recursos/VFX/halo-solar.html: canvas #fx, window.renderFrame(t) determinístico, fundo transparente, margem ~8%. -->
<canvas id="fx" width="512" height="512"></canvas>
<script>
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647;}
function glow(x,y,r,stops){const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([p,c])=>g.addColorStop(p,c));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
window.renderFrame=function(t){const s=canvas.width,c=s/2;ctx.clearRect(0,0,s,s);ctx.save();ctx.translate(c,c);
ctx.rotate(-0.6+Math.sin(t*Math.PI*2)*0.5);const L=s*0.36,W=s*0.09;
const heat=Math.max(0,1-t*1.25),ash=Math.min(1,t*1.4),fade=t>0.8?(1-t)/0.2:1;
const col=(a)=>{const r=Math.round(255*heat+120*(1-heat)),g=Math.round(150*heat+112*(1-heat)),b=Math.round(50*heat+110*(1-heat));return `rgba(${r},${g},${b},${a})`;};
if(heat>0){ctx.globalCompositeOperation='lighter';glow(0,0,L*0.9,[[0,`rgba(255,140,40,${0.45*heat})`],[1,'rgba(255,80,20,0)']]);ctx.globalCompositeOperation='source-over';}
ctx.beginPath();ctx.moveTo(-L*0.5,0);ctx.quadraticCurveTo(0,-W*1.4,L*0.5,0);ctx.quadraticCurveTo(0,W*1.4,-L*0.5,0);ctx.fillStyle=col(0.95*fade);ctx.fill();
ctx.strokeStyle=heat>0.2?`rgba(255,235,170,${0.9*fade*heat})`:`rgba(90,85,95,${0.8*fade})`;ctx.lineWidth=s*0.012;ctx.beginPath();ctx.moveTo(-L*0.6,0);ctx.lineTo(L*0.45,0);ctx.stroke();
const r=rng(11);for(let i=0;i<10;i++){const x=(r()-0.5)*L,y=(r()-0.5)*W*1.6,a=Math.max(0,ash-0.3)*fade;ctx.fillStyle=`rgba(110,105,115,${a})`;ctx.fillRect(x,y,s*0.02,s*0.02);}
ctx.restore();};
if(!navigator.webdriver){document.body.classList.add('preview');let t0=performance.now();(function loop(n){window.renderFrame(((n-t0)/1400)%1);requestAnimationFrame(loop);})(t0);}
</script></body></html>
